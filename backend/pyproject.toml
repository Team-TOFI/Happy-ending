[project]
name = "hackathon-backend"
version = "0.1.0"
description = "Hackathon FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
