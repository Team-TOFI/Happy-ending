[project]
name = "hackathon-scraping"
version = "0.1.0"
description = "Platform-specific product collectors with shared PostgreSQL persistence"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
catalog-scrape = "catalog_scraper.cli:main"
musinsa-scrape = "catalog_scraper.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
