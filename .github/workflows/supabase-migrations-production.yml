# Adapted from gomin-diary/gomin/.github/workflows/supabase-migrations-production.yml
name: Supabase production migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.122.0'

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned Supabase CLI
        run: npx --yes "supabase@$SUPABASE_CLI_VERSION" --version
      - name: Apply pending production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          for setting in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure $setting in the supabase-production GitHub environment."
              exit 1
            fi
          done
          npx --yes "supabase@$SUPABASE_CLI_VERSION" link --project-ref "$SUPABASE_PROJECT_ID"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --skip-vault --include-all --dry-run
          npx --yes "supabase@$SUPABASE_CLI_VERSION" db push --linked --skip-vault --include-all --yes
